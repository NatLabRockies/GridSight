<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GridSight</title>
    <meta name="description" content="An extensible geospatial analytics and animation platform." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Dark background applied at the document level so the very first
         paint (before the JS bundle has even parsed) matches the splash
         instead of flashing white while Vite/Tauri load the script. -->

      html, body, #root {
        background: #0d1117;
        margin: 0;
        color: #fff;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
