[project]
name = "meridian-sdk"
version = "0.1.0"
description = "SDK for building Meridian extensions"
# readme = "README.md"
requires-python = ">=3.12"
# Intentionally minimal dependencies — extension developers shouldn't
# need to pull in FastAPI, SQLAlchemy, etc. just to define interfaces.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]
